[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lax-forecast"
version = "0.1.0"
description = "Probability-distribution forecasts of LAX daily high temperature for Kalshi LAHIGH contracts"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "requests>=2.30",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
    "ipykernel>=6.20",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lax_forecast = ["py.typed"]
